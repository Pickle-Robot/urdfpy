[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urdfpy"
dynamic = ["version"]
description = "URDF parser and manipulator for Python"
license = "MIT"
authors = [{name = "Matthew Matl", email = "matthewcmatl@gmail.com"}]
keywords = ["robotics", "ros", "urdf", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.8"
dependencies = [
    "lxml",
    "networkx",
    "numpy",
    "pillow",
    "pycollada",
    "scipy",
    "trimesh",
]

[project.optional-dependencies]
dev = ["flake8", "packaging", "pytest", "pytest-cov"]

# The wheel version is composed at build time from the upstream version, a
# monotonic release counter and (off master) the branch name; see _pickle_version.py.
[tool.hatch.version]
source = "code"
path = "_pickle_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["urdfpy"]
